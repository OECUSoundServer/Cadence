        <main class="top">
            <article>
                <section id="lyrics-index">
                    <h2 class="title DotGothic16">
                        <img class="emoji" src="../img/nikukyu.svg" /> 歌詞一覧
                    </h2>
                    <p class="index-lead">
                        Cadenceで公開している歌詞一覧です。曲情報や歌詞の一部から各ページへアクセスできます。
                    </p>

                    <div class="lyrics-toolbar">
                        <div class="toolbar-group">
                            <label for="lyrics-search">検索</label>
                            <input type="text" id="lyrics-search" placeholder="曲名・作詞者・編曲・収録・イベント・タグで検索"/>
                        </div>

                        <div class="toolbar-group">
                            <label for="lyricist-filter">作詞者</label>
                            <select id="lyricist-filter">
                                <option value="">すべて</option>
                            </select>
                        </div>

                        <!-- <div class="toolbar-group">
                            <label for="language-filter">言語</label>
                            <select id="language-filter">
                                <option value="">すべて</option>
                                <option value="ja">日本語</option>
                                <option value="en">English</option>
                                <option value="zh">中文</option>
                            </select>
                        </div>

                        <div class="toolbar-group">
                            <label for="mv-filter">MV / 動画</label>
                            <select id="mv-filter">
                                <option value="">すべて</option>
                                <option value="true">あり</option>
                                <option value="false">なし</option>
                            </select>
                        </div> -->

                        <div class="toolbar-group">
                            <label for="sort-order">並び順</label>
                            <select id="sort-order">
                                <option value="year-desc">新しい順</option>
                                <option value="year-asc">古い順</option>
                                <option value="title-asc">曲名順</option>
                            </select>
                        </div>
                    </div>

                    <div class="toolbar-group">
                        <label>タグ</label>
                        <div id="tag-filter" class="tag-filter"></div>
                    </div>

                    <p id="lyrics-count" class="lyrics-count"></p>

                    <div class="lyrics-list" id="lyrics-list">

                    <p id="lyrics-empty" class="lyrics-empty" hidden>
                        条件に一致する曲が見つかりませんでした。
                    </p>
                </section>
