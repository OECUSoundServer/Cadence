<body>
    <!-- ロード画面 -->
    <script data-cfasync="false" data-no-defer="1">
        var ewww_webp_supported = false;
    </script>

    <div id="loftloader-wrapper" class="pl-imgloading" data-show-close-time="5000" data-max-load-time="60000">

        <div class="loader-section section-up"></div>
        <div class="loader-section section-down"></div>

        <div class="loader-inner">
            <div id="loader">
                <div class="imgloading-container">
                    <span class="lazyload" data-back="https://oecusoundserver.github.io/Cadence/img/nikukyu.png">
                    </span>
                </div>

                <img width="76" height="59" data-no-lazy="1" class="skip-lazy" alt="loader image"
                    src="https://oecusoundserver.github.io/Cadence/img/nikukyu.png">
            </div>
        </div>

        <div class="loader-close-button" style="display: none;">
            <span class="screen-reader-text">Close</span>
        </div>
    </div>

    <!-- ヘッダー -->
    <header class="header">

        <!-- Header Logo -->
        <div class="logo">
            <p>
                <a href="https://oecusoundserver.github.io/Cadence/index.html">
                    <img src="https://oecusoundserver.github.io/Cadence/img/yellow.png" alt="Cadence_Icon" class="logo">
                </a>
            </p>
        </div>

        <!-- Menu -->
        <div id="hamburger">
            <div class="icon">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <!-- Nav Phone -->
        <nav class="nav sm">
            <ul>
                <li><a href="https://oecusoundserver.github.io/Cadence/index.html">トップページ</a></li>
                <li><a href="https://oecusoundserver.github.io/Cadence/about/index.html">サークルについて</a></li>

                <li><a href="https://oecusoundserver.github.io/Cadence/event/index.html">イベント</a></li>
                <li><a href="https://oecusoundserver.github.io/Cadence/special/bosyu.html">募集</a></li>
                <li><a href="https://oecusoundserver.github.io/Cadence/link.html">リンク</a></li>
                <li><a href="https://oecusoundserver.github.io/Cadence/Other/index.html">その他</a></li>
            </ul>
        </nav>

        <!-- Nav PC -->
        <nav class="nav pc">
            <ul>
                <li><a href="https://oecusoundserver.github.io/Cadence/index.html">トップページ</a></li>
                <li><a href="https://oecusoundserver.github.io/Cadence/about/index.html">サークルについて</a></li>
                <li><a href="https://oecusoundserver.github.io/Cadence/portfolio/index.html">作品</a></li>
                <li><a href="https://oecusoundserver.github.io/Cadence/event/index.html">イベント</a></li>
                <li><a href="https://oecusoundserver.github.io/Cadence/special/bosyu.html">募集</a></li>
                <li><a href="https://oecusoundserver.github.io/Cadence/link.html">リンク</a></li>
                <li><a href="https://oecusoundserver.github.io/Cadence/Other/index.html">その他</a></li>
            </ul>
        </nav>
    </header>
    <hr>

    <!-- 本文 -->
    <main class="top">
        <article>
            <!-- 歌詞 -->
            <section id="lyrics">
                <!-- 曲名 -->
                <h2 id="song-title">読み込み中...</h2>
                <!-- 曲情報 -->
                <div class="lyrics-meta">

                    <p id="song-composer-row" hidden>
                        <strong>作曲:</strong>
                        <span id="song-composer">-</span>
                    </p>

                    <p>
                        <strong>編曲:</strong>
                        <span id="song-arranger">-</span>
                    </p>

                    <p>
                        <strong>作詞:</strong>
                        <span id="song-lyricist">-</span>
                    </p>

                    <p>
                        <strong>ボーカル:</strong>
                        <span id="song-vocal">-</span>
                    </p>

                    <p>
                        <strong>収録:</strong>
                        <span id="song-release">-</span>
                    </p>

                    <p>
                        <strong>発表:</strong>
                        <span id="song-published">-</span>
                    </p>

                </div>

                <!-- 言語切り替え -->
                <div id="lang-switch" class="lang-switch" aria-label="言語切り替え" hidden></div>
                <hr>

                <!-- 公開前・エラー等のメッセージ -->
                <div id="lyrics-message" hidden></div>

                <div id="media-follow" class="media-follow" data-sticky-top="72" data-height="225" data-ease="0.18"
                    data-insert-anchors="auto">

                    <!-- 歌詞本文 -->
                    <div id="lyrics-container">
                        <div id="lyrics-text" class="lyrics-text media-follow__text" data-role="text" lang="ja">
                        </div>
                        <div class="media-follow__side" data-role="side">
                        </div>
                    </div>

                    <!-- 動画表示位置 -->
                    <div id="lyrics-video" class="media-follow__side" data-role="side"></div>

            </section>


            <!-- Release / CD info -->
            <section id="release" class="release" hidden>
                <div class="release-card">
                    <div class="release-media">
                        <img id="release-image" src="../img/yellow.png" alt="">
                    </div>
                    <div class="release-body">
                        <h3 id="release-title" class="release-title"></h3>
                        <div id="release-sub" class="release-sub"></div>
                        <dl class="release-meta">
                            <div>
                                <dt>収録曲</dt>
                                <dd id="release-track">-</dd>
                            </div>
                            <div>
                                <dt>編曲</dt>
                                <dd id="release-arranger">-</dd>
                            </div>
                            <div>
                                <dt>作詞</dt>
                                <dd id="release-lyricist">-</dd>
                            </div>
                            <div>
                                <dt>イベント</dt>
                                <dd id="release-event">-</dd>
                            </div>
                            <div>
                                <dt>頒布形態</dt>
                                <dd id="release-format">-</dd>
                            </div>
                            <div>
                                <dt>ジャンル</dt>
                                <dd id="release-genre">-</dd>
                            </div>
                        </dl>


                        <div class="release-actions">
                            <a id="release-page-link" class="btn primary" href="#">
                                作品ページへ
                            </a>
                            <a class="btn ghost" href="https://oecusoundserver.github.io/Cadence/portfolio/index.html">
                                作品一覧
                            </a>
                            <a class="btn ghost" href="https://oecusoundserver.github.io/Cadence/lyrics/index.html">
                                歌詞一覧
                            </a>
                        </div>
                    </div>
                </div>
            </section>
        </article>
    </main>


    <!-- Page top -->
    <div id="pagetop" hidden>
        <img src="../img/TOP.png" width="80">
    </div>


    <!-- フッター -->
    <footer id="footer" class="dark">

                            <a href="../about/index.html">About This Circle</a>
                        </div>
                    </div>

                    <div class="right">
                        <div id="share-buttons" class="share-bar" data-hashtags="Cadence" data-share-title="BaiShou">
                        </div>
                    </div>
                </div>
            </div>
        </div>

    <script src="../js/stickyPreview.js"></script>
    <script src="../js/lyrics-preview-core.js"></script>

</body>
