<body>

    <!-- ======================================
    HEADER
    ====================================== -->
    <header class="site-header portal-header">

        <div class="header-inner portal-header-inner">

            <!-- Cadence -->
            <a href="./cadence.html" class="header-logo-link">
                <img src="./img/CircleLogo.png" alt="Cadence" class="header-logo">
            </a>

            <!-- にゃーふぃーの法則 -->
            <a href="./nyarphy/index.html" class="header-logo-link">
                <img src="./img/nyarphy-logo.png" alt="にゃーふぃーの法則" class="header-logo">
            </a>

        </div>

    </header>

    <!-- ======================================
    MAIN
    ====================================== -->
    <main>

        <!-- PICK UP -->
        <section class="section pickup-section" aria-labelledby="pickup-title">

            <div class="section-heading">
                <h1 id="pickup-title">PICK UP</h1>
                <p>注目のお知らせ</p>
            </div>

            <div class="slider" id="pickup-slider" aria-label="注目のお知らせ">

                <div class="slider-viewport" id="slider-viewport" aria-live="off">

                    <!-- JavaScriptでバナーを生成 -->
                </div>

                <div class="slider-controls">

                    <button type="button" class="slider-arrow" id="slider-prev" aria-label="前のバナー">
                        &#10094;
                    </button>

                    <div class="slider-dots" id="slider-dots" aria-label="バナーの切り替え">
                    </div>

                    <button type="button" class="slider-arrow" id="slider-next" aria-label="次のバナー">
                        &#10095;
                    </button>

                </div>
            </div>
        </section>

        <!-- OUR CIRCLES -->
        <section class="section circles-section" aria-labelledby="circles-title">

            <div class="section-heading centered">
                <h2 id="circles-title">OUR CIRCLES</h2>
                <p>各サークルの活動はこちらから</p>
            </div>

            <div class="circle-grid">

                <!-- CADENCE -->
                <a class="circle-card cadence" href="cadence.html">

                    <div class="circle-logo-area">
                        <img src="./img/CircleLogo.png" alt="" class="circle-logo" data-fallback="Cadence">

                        <span class="logo-fallback">
                            Cadence
                        </span>
                    </div>

                    <div class="circle-info">
                        <h3>Cadence</h3>

                        <p>
                            東方Projectを中心とした<br>
                            ゲーム音楽アレンジ
                        </p>

                        <span class="circle-enter">
                            ENTER SITE
                            <span aria-hidden="true">↗</span>
                        </span>
                    </div>
                </a>

                <!-- NYARPHY -->
                <a class="circle-card nyarphy" href="nyarphy/index.html">

                    <div class="circle-logo-area">
                        <img src="img/nyarphy-logo.png" alt="" class="circle-logo" data-fallback="にゃーふぃーの法則">

                        <span class="logo-fallback">
                            にゃーふぃーの法則
                        </span>
                    </div>

                    <div class="circle-info">
                        <h3>にゃーふぃーの法則</h3>

                        <p>
                            ケモノ系イラスト・漫画・同人誌
                        </p>

                        <span class="circle-enter">
                            ENTER SITE
                            <span aria-hidden="true">↗</span>
                        </span>
                    </div>
                </a>

            </div>
        </section>

        <!-- ======================================
        NEWS & UPCOMING EVENTS
        ====================================== -->
        <section class="section information-section">

            <div class="information-grid">

                <!-- ======================================
                NEWS（左側）
                ====================================== -->
                <div class="information-news">

                    <div class="section-heading">
                        <h2 id="news-title">NEWS</h2>
                        <p>最新情報</p>
                    </div>

                    <div class="news-filters" role="group" aria-label="ニュースの絞り込み">

                        <button type="button" class="filter-button active" data-news-filter="all" aria-pressed="true">
                            すべて
                        </button>

                        <button type="button" class="filter-button" data-news-filter="cadence" aria-pressed="false">
                            Cadence
                        </button>

                        <button type="button" class="filter-button" data-news-filter="nyarphy" aria-pressed="false">
                            にゃーふぃーの法則
                        </button>

                    </div>

                    <div id="news-list" class="news-list" data-news-circle="all" data-news-source="./new.html"
                        data-news-root="./">
                        お知らせを読み込んでいます...
                    </div>

                    <div class="news-more">
                        <a id="news-more-button" href="./news.html" class="more-button">
                            もっと見る →
                        </a>
                    </div>

                </div>

                <!-- ======================================
                UPCOMING EVENTS（右側）
                ====================================== -->
                <aside class="information-events" aria-labelledby="events-title">

                    <div class="section-heading">
                        <h2 id="events-title">EVENTS</h2>
                        <p>参加予定イベント</p>
                    </div>

                    <div id="event-list" class="event-list" data-event-source="./data/events.json" data-event-root="./"
                        data-event-limit="5">
                        イベント情報を読み込んでいます...
                    </div>

                </aside>

            </div>

        </section>
